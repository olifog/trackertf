# Production stack for the AWS EC2 box (us-east-1).
# Postgres is RDS (managed, TLS) — reached via DATABASE_URL in .env; there is no
# local postgres service. ClickHouse runs here as the analytics store: internal
# services use plaintext 8123 over the docker network, Vercel connects over
# HTTPS 8443 with the self-signed cert in ./certs (scripts/gen-ch-cert.sh).
services:
  # Analytics store. Rebuilt from Postgres every 15 min by the syncer.
  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: trackertf
      CLICKHOUSE_USER: trackertf
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8443:8443"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  crawler:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      STEAM_API_KEY: ${STEAM_API_KEY:?set in .env}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}

  analyser:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
    command: ["bun", "run", "src/analyser.ts"]

  attributor:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
    command: ["bun", "run", "src/attributor.ts"]

  syncer:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      CLICKHOUSE_URL: http://trackertf:${CLICKHOUSE_PASSWORD}@clickhouse:8123/trackertf
    command: ["bun", "run", "src/syncer.ts"]

  scanner:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      STEAM_API_KEY: ${STEAM_API_KEY:?set in .env}
    command: ["bun", "run", "src/scanner.ts"]

  sampler:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      STEAM_API_KEY: ${STEAM_API_KEY:?set in .env}
      SAMPLER_CALLS_PER_DAY: ${SAMPLER_CALLS_PER_DAY:-15000}
    command: ["bun", "run", "src/sampler.ts"]

volumes:
  chdata:
