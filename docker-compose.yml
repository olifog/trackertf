# Production stack for the VPS (UBUNTU-MAIN).
# Postgres is exposed on 5432 for Vercel's serverless functions — protected by
# scram auth + TLS; create a read-only role for the web app (see PLAN.md).
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: trackertf
      POSTGRES_USER: trackertf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # self-signed cert for TLS; generate with scripts/gen-pg-cert.sh
      - ./certs:/certs:ro
    command: >-
      postgres -c shared_buffers=2GB -c effective_cache_size=8GB
      -c password_encryption=scram-sha-256
      -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackertf"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Analytics store. Internal services reach it over plaintext HTTP on the
  # docker network (8123); Vercel connects over HTTPS (8443) with the same
  # self-signed certs postgres uses. Password auth in both cases.
  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: trackertf
      CLICKHOUSE_USER: trackertf
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8443:8443"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  crawler:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://trackertf:${POSTGRES_PASSWORD}@postgres:5432/trackertf
      STEAM_API_KEY: ${STEAM_API_KEY:?set in .env}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}

  analyser:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://trackertf:${POSTGRES_PASSWORD}@postgres:5432/trackertf
    command: ["bun", "run", "src/analyser.ts"]

  syncer:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://trackertf:${POSTGRES_PASSWORD}@postgres:5432/trackertf
      CLICKHOUSE_URL: http://trackertf:${CLICKHOUSE_PASSWORD}@clickhouse:8123/trackertf
    command: ["bun", "run", "src/syncer.ts"]

  scanner:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://trackertf:${POSTGRES_PASSWORD}@postgres:5432/trackertf
      STEAM_API_KEY: ${STEAM_API_KEY:?set in .env}
    command: ["bun", "run", "src/scanner.ts"]

  sampler:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://trackertf:${POSTGRES_PASSWORD}@postgres:5432/trackertf
      STEAM_API_KEY: ${STEAM_API_KEY:?set in .env}
      SAMPLER_CALLS_PER_DAY: ${SAMPLER_CALLS_PER_DAY:-15000}
    command: ["bun", "run", "src/sampler.ts"]

volumes:
  pgdata:
  chdata:
